# FedGuard asynchronous aggregation: merge each update on arrival.
#   w_global <- (1 - a_i) w_global + a_i w_client,   a_i = alpha0 * (n_i / N) * s(tau)
defaults: [fl/fedavg]
algorithm: fedguard_async
mode: async
alpha0: 4.0              # selected on validation AUPRC from {0.5, 1, 2, 4} (D20); alpha = min(1, alpha0 n_i/N s(tau))
staleness_fn: exp        # exp: s = exp(-lambda * tau) | poly: s = (1 + tau)^(-a)  (FedAsync) | const
staleness_lambda: 0.35
staleness_poly_a: 0.5
max_staleness: 8         # updates staler than this are dropped
total_updates: 160       # = rounds x clients: same number of local jobs as sync
eval_every_updates: 4

_fast:
  total_updates: 8
